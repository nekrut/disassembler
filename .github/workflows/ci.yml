name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: clippy + test (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: walker
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            walker/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('walker/Cargo.lock') }}
      # Offline gate: the network/data tests are #[ignore] and never run here.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --release -- -D warnings
      - name: Test
        run: cargo test --release

  python-tests:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run LexicMapStreamer tests
        run: python3 python/test_lexicmap_streamer.py
      # Skips cleanly when `requests` is absent, which it is on this runner: the module
      # imports it at scope. Runs for real wherever the harvester's deps are installed.
      - name: Run kmindex harvester tests
        run: python3 python/test_harvest_kmindex.py
      # Both sieve tests build extern/kmer-diversity-sieve themselves (cc only) and skip
      # cleanly if the submodule or a compiler is missing.
      - name: Sieve binary concordance
        run: bash tests/test_sieve.sh
      - name: Sieve pipeline integration
        run: python3 tests/test_sieve_integration.py

  golden:
    name: golden concordance (manual)
    # Needs GraphAligner and network access to the Logan S3 bucket, so it is not on the
    # every-push path. Trigger it from the Actions tab (Run workflow) when the walk changes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install GraphAligner
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gaa
          create-args: >-
            -c conda-forge -c bioconda graphaligner=1.0.20
      - name: Build walker
        run: cargo build --release
        working-directory: walker
      - name: Golden concordance
        shell: bash -el {0}
        run: bench/check_golden.sh
