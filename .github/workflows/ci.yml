name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: clippy + test (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: walker
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            walker/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('walker/Cargo.lock') }}
      # Offline gate: the network/data tests are #[ignore] and never run here.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --release -- -D warnings
      - name: Test
        run: cargo test --release

  python-tests:
    name: python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package is noarch and declares requires-python >=3.11, so every version it
        # claims gets tested. Only an environment that must also hold GraphAligner 1.0.17b
        # is capped at 3.12, and nothing in this job needs it.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install disassembler (editable)
        run: pip install -e .
      # Discovery, not a hand-kept list of files: test_cli.py and
      # test_dedup_sieve_equivalence.py sat in the tree unrun because nobody added a step for
      # them. test_sieve_integration.py is picked up here too; it builds
      # extern/kmer-diversity-sieve itself (cc only) and skips cleanly without the submodule.
      - name: Unit tests
        run: python -m unittest discover -s tests -t tests -v
      # Bash, so not discoverable; also builds the sieve itself.
      - name: Sieve binary concordance
        run: bash tests/test_sieve.sh

  real-tools:
    name: msa against real mafft and fasttree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MAFFT and FastTree
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: tools
          create-args: >-
            -c conda-forge -c bioconda python=3.12 pip mafft=7.526 fasttree=2.2.0
      - name: Install disassembler (editable)
        shell: bash -el {0}
        run: pip install -e .
      # test_msa.py stubs both tools out, which is what makes its gate checks deterministic
      # but also means no job ever runs the real MAFFT command line. This one does. It skips
      # itself when the tools are missing, and a skip here would be a green job that checked
      # nothing, so a skip fails the step.
      - name: Real-tool MSA test
        shell: bash -el {0}
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t tests -p 'test_msa_real_tools.py' -v \
            2>&1 | tee "$RUNNER_TEMP/real_tools.log"
          if grep -q "skipped" "$RUNNER_TEMP/real_tools.log"; then
            echo "the real-tool MSA test skipped itself; mafft/fasttree were not found" >&2
            exit 1
          fi

  golden:
    name: golden concordance and data-backed tests (manual)
    # Needs GraphAligner and network access to the Logan S3 bucket, so it is not on the
    # every-push path. Trigger it from the Actions tab (Run workflow) when the walk changes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install GraphAligner
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gaa
          create-args: >-
            -c conda-forge -c bioconda graphaligner=1.0.17b zstd
      - name: Build walker
        run: cargo build --release
        working-directory: walker
      - name: Golden concordance
        shell: bash -el {0}
        run: bench/check_golden.sh
      # The walker's #[ignore] tests check it against real Logan files and recorded
      # measurements. Without their data they skip themselves and still pass, which is how
      # three of them stayed broken from the -k default change until 0.1.1, so a SKIP fails
      # this step. `cross_check` only writes a GFA for inspection and asserts nothing.
      - name: Data-backed walker tests
        # Independent of the golden check above, so it runs even when that fails.
        if: ${{ !cancelled() }}
        shell: bash -el {0}
        working-directory: walker
        run: |
          set -o pipefail
          data="$RUNNER_TEMP/logan"
          printf 'ERR2028820\nSRR8209082\n' > "$RUNNER_TEMP/accessions.txt"
          target/release/logan-walker --fetch-only -l "$RUNNER_TEMP/accessions.txt" \
            --unitigs-cache "$data" -o "$RUNNER_TEMP/fetch"
          zstd -dc "$data/ERR2028820.unitigs.fa.zst" > "$RUNNER_TEMP/ERR2028820.unitigs.fa"
          LOGAN_TEST_ZST="$data/ERR2028820.unitigs.fa.zst" LOGAN_TEST_DIR="$data" \
            LOGAN_TEST_PLAIN="$RUNNER_TEMP/ERR2028820.unitigs.fa" \
            cargo test --release -- --ignored --nocapture --test-threads 1 --skip cross_check \
            2>&1 | tee "$RUNNER_TEMP/ignored.log"
          if grep -n "SKIP:" "$RUNNER_TEMP/ignored.log"; then
            echo "a data-backed test skipped itself (lines above); it was not checked" >&2
            exit 1
          fi
