# Toolchain for the walker's external binaries and the downstream codon MSA / tree step.
# Rust itself is not here — install via rustup (https://rustup.rs) and build walker/ with cargo.
#
#   conda env create -f environment.yml    # or: mamba env create -f environment.yml
#   conda activate disassembler
#
# The GraphAligner pin matches the version the golden fixtures were captured against
# (bench/golden/GRAPHALIGNER_VERSION).
name: disassembler
channels:
  - conda-forge
  - bioconda
dependencies:
  # Graph alignment: the walker shells out to `GraphAligner -x dbg`. 1.0.17b, not 1.0.20:
  # 1.0.19 and later clip the last query base, and 1.0.18 cannot be installed with Python 3.11+.
  # 1.0.17b holds libzlib below 1.3, which is what caps python, blast and zstd below.
  # See docs/issue_graphaligner_end_clipping.md section 10.
  - graphaligner=1.0.17b
  # Codon MSA + phylogeny (`disassembler msa`).
  - mafft=7.526
  - fasttree=2.2.0
  # BLAST: the Rust walker does not use it (in-memory k-mer anchoring replaced it). Kept for
  # the manual contig-vs-unitig comparison written up in docs/contigs_vs_unitigs.md.
  - blast=2.16.0
  - zstd=1.5.6
  - python=3.12
  # Python deps for the reference walker, codon builder, and benchmark harness.
  - biopython
  - requests
  - zstandard
  - numpy
  - pandas
  - matplotlib
  - pip
  # Install the `disassembler` console script and package from this checkout.
  - pip:
      - -e .
