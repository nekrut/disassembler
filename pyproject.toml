[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disassembler"
version = "0.1.0"
description = "Reconstruct coding haplotypes from planetary sequence indexes (Logan kmindex / LexicMap)."
requires-python = ">=3.11"
dependencies = [
    "biopython",
    "requests",
    "zstandard",
    "numpy",
    "pandas",
]

[project.scripts]
disassembler = "disassembler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
