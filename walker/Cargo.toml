[package]
name = "logan-walker"
version = "0.1.0"
edition = "2021"
description = "Rust path walker for Logan unitigs. See docs/walker.md"
publish = false

[[bin]]
name = "logan-walker"
path = "src/main.rs"

# Deliberately minimal. Concurrency is std::thread plus a bounded
# std::sync::mpsc::sync_channel behind an Arc<Mutex<Receiver>>; summary.json and bubbles.json
# are written by hand in io/output.rs rather than through serde. Only the S3 streaming and
# decompression in stages/stream.rs, and reading gzipped inputs in io/input.rs (flate2, on its
# pure-Rust miniz_oxide backend, so no system zlib), pull in crates.
[dependencies]
flate2 = "1.1.10"
ureq = "3.4.1"
zstd = "0.14.0"

[dev-dependencies]
# Test-only: verifies reconstructed haplotypes against the golden fixtures by hash.
sha2 = "0.11.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
