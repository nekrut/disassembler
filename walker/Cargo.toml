[package]
name = "logan-walker"
version = "0.1.0"
edition = "2021"
description = "Rust path walker for Logan unitigs. See docs/walker.md"
publish = false

[[bin]]
name = "logan-walker"
path = "src/main.rs"

# Deliberately minimal. Concurrency is std::thread plus a bounded
# std::sync::mpsc::sync_channel behind an Arc<Mutex<Receiver>>; summary.json and bubbles.json
# are written by hand in io/output.rs rather than through serde. Crates are pulled in only for
# the S3 streaming and decompression in stages/stream.rs; reading gzipped inputs in io/input.rs
# (flate2, on its pure-Rust miniz_oxide backend, so no system zlib); and the run's scratch
# directory in scratch.rs, removed on SIGTERM (signal-hook) and swept by PID (libc, already a
# dependency of the others).
[dependencies]
flate2 = "1.1.10"
libc = "0.2.189"
signal-hook = "0.4.5"
ureq = "3.4.1"
zstd = "0.14.0"

[dev-dependencies]
# Test-only: verifies reconstructed haplotypes against the golden fixtures by hash.
sha2 = "0.11.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
